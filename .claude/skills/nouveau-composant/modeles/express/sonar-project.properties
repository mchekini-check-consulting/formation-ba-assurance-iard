# Analyse SonarQube du composant (projet <dépôt>-<composant>), lancée par la CI
# après make test-unit (formation-ba-gitops/ci-template/sonarqube).
sonar.sources=src
sonar.tests=src,test
sonar.exclusions=**/*.test.ts
sonar.test.inclusions=**/*.test.ts,**/*.e2e-test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Démarrage / câblage, sans logique à tester : hors calcul de couverture
sonar.coverage.exclusions=src/server.ts,src/db/**,src/migrate.ts
