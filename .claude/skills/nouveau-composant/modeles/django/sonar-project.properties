# Analyse SonarQube du composant (projet <dépôt>-<composant>), lancée par la CI
# après make test-unit (formation-ba-gitops/ci-template/sonarqube).
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/migrations/**,**/tests/**,.venv/**
sonar.test.inclusions=**/tests/**
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
# Démarrage / câblage, sans logique à tester : hors calcul de couverture
sonar.coverage.exclusions=manage.py,config/**,gunicorn.conf.py
