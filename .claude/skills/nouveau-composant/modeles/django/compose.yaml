# Base locale pour python manage.py runserver __PORT_LOCAL__ (même URL que la valeur par
# défaut de config/settings.py) :
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: __BASE__
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "__PORT_DB_LOCAL__:5432"
