# Push sur main uniquement : construit chaque dossier modifié qui contient un Dockerfile
# (backend/, frontend/, ...), pousse l'image dans ECR via OIDC, puis écrit son sha
# dans helm.yaml (tag.dev) -> ArgoCD redéploie dev.
# Image : <registre ECR>/<dépôt>/<dossier>:<sha>
name: ci

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.detect.outputs.components }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event.before }}
        run: |
          ALL=$(ls */Dockerfile | xargs -n1 dirname)
          if git cat-file -e "$BASE" 2>/dev/null; then
            FILES=$(git diff --name-only "$BASE" HEAD)
            CHANGED=$(for c in $ALL; do grep -q "^$c/" <<<"$FILES" && echo "$c"; done || true)
          else
            CHANGED=$ALL   # premier push : tout construire
          fi
          echo "components=$(jq -cn '$ARGS.positional' --args $CHANGED)" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    runs-on: ubuntu-24.04-arm   # nodes EKS en arm64 (Graviton)
    permissions:
      contents: read
      id-token: write           # jeton OIDC -> rôle IAM
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::205493924920:role/role-team-eks-dev-gha-formation-ba
          aws-region: eu-west-3
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ github.event.repository.name }}/${{ matrix.component }}:${{ github.sha }}

  # Écrit le sha des images construites dans helm.yaml (tag.dev uniquement).
  # qualif/prod : promotion manuelle par PR.
  update-tag:
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write           # push du commit avec GITHUB_TOKEN (ne relance pas la CI)
    steps:
      - uses: actions/checkout@v4
      - env:
          COMPONENTS: ${{ needs.changes.outputs.components }}
        run: |
          for c in $(jq -r '.[]' <<<"$COMPONENTS"); do
            yq -i "(.applications[] | select(.name == \"$c\")).tag.dev = \"$GITHUB_SHA\"" helm.yaml
          done
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): ${GITHUB_SHA::7} ($(jq -r 'join(", ")' <<<"$COMPONENTS"))"
          git pull --rebase && git push
