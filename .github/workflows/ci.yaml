# Push sur main uniquement : construit chaque dossier modifié qui contient un Dockerfile
# (backend/, frontend/, ...) et pousse l'image dans ECR via OIDC. Kargo détecte
# l'image, écrit son sha dans helm.yaml (tag.dev) -> ArgoCD redéploie dev.
# Les étapes viennent de formation-ba-gitops/ci-template.
name: ci

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.detect.outputs.components }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        uses: mchekini-check-consulting/formation-ba-gitops/ci-template/detect-changes@main

  build:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    runs-on: ubuntu-24.04-arm   # nodes EKS en arm64 (Graviton)
    permissions:
      contents: read
      id-token: write           # jeton OIDC -> rôle IAM
    steps:
      - uses: actions/checkout@v4
      - uses: mchekini-check-consulting/formation-ba-gitops/ci-template/build-push@main
        with:
          component: ${{ matrix.component }}
          tag: ${{ needs.changes.outputs.sha }}

  # Désactivé : Kargo détecte l'image dans ECR et écrit tag.dev (promotion auto).
  # Réactivation (retour arrière) : variable d'organisation CI_UPDATE_TAG=true.
  # Ne jamais l'activer en même temps que Kargo (deux écritures de tag.dev).
  update-tag:
    needs: [changes, build]
    if: vars.CI_UPDATE_TAG == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write           # push du commit avec GITHUB_TOKEN (ne relance pas la CI)
    steps:
      - uses: actions/checkout@v4
      - uses: mchekini-check-consulting/formation-ba-gitops/ci-template/update-tag@main
        with:
          components: ${{ needs.changes.outputs.components }}
          sha: ${{ needs.changes.outputs.sha }}
