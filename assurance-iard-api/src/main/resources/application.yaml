spring:
  cloud:
    openfeign:
      client:
        config:
          moteurtarifaire:
            connect-timeout: 1000
            read-timeout: 2000

  application:
    name: assurance-iard-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assurance_iard}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          # true : le login (SMTP_USER) est envoyé au serveur. Sans cela JavaMail ne
          # s'authentifie pas, même avec username/password renseignés (Mailpit : le
          # login sert de tag au mail). false par défaut : docker-compose local sans login.
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_TLS:false}
            required: ${SMTP_TLS:false}

  # US-13 : le service contrôle les 5 Mo avec un message précis ;
  # ces limites plus larges bloquent seulement les envois démesurés.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 13MB

# Une valeur refusée (téléphone, nom...) ne doit jamais finir dans les logs
logging:
  level:
    net.checkconsulting.assuranceiard.api: ${LOG_LEVEL:info}
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR

server:
  port: 8080
  forward-headers-strategy: framework

assurance:
  connexion:
    # Bouchon de la signature de contrat : code de signature 123456 accepté.
    # Désactivé par défaut (voir helm.yaml, docker-compose.yaml et pom.xml).
    code-bouchon-actif: ${CODE_BOUCHON_ACTIF:false}
    # Adresse de l'écran, propre à chaque environnement (helm.yaml) : base du lien de réinitialisation (US-07).
    url-frontend: ${FRONTEND_URL:http://localhost:4200}
  # US-07 : lien de réinitialisation envoyé par e-mail, valable 24 heures par défaut (valeur à confirmer par la PO).
  # Pour essayer un lien expiré en local : LIEN_REINITIALISATION_VALIDITE=2m.
  reinitialisation:
    validite-lien: ${LIEN_REINITIALISATION_VALIDITE:24h}
  # US-06 : le code de connexion est envoyé par e-mail. Code de test 123456 éteint partout par défaut
  # (décision PO en attente) ; CODE_TEST_CONNEXION_ACTIF=true le rallume, jamais en preprod ni en prod.
  double-authentification:
    code-test-actif: ${CODE_TEST_CONNEXION_ACTIF:false}
  # US-04 : comptes de recette (2 assurés, un gestionnaire, un administrateur) créés au démarrage.
  # Allumé en local (pom.xml, docker-compose.yaml), dev et qualif (helm.yaml) ; jamais en preprod ni en prod.
  donnees-test:
    actif: ${DONNEES_TEST_ACTIVES:false}
    mot-de-passe: ${DONNEES_TEST_MOT_DE_PASSE:Recette2026}
  justificatifs:
    # Dossier local exclu de Git ; en ligne, dossier temporaire (voir helm.yaml).
    dossier: ${JUSTIFICATIFS_DOSSIER:justificatifs}
  mail:
    from: ${MAIL_FROM:noreply@assureasy.fr}
  # T-03 : documents PDF générés. PROVISOIRE, À VALIDER PAR LE PO : mentions de l'assureur fictif, garanties
  # par formule et exclusions (valeurs fictives, modifiables ici sans toucher au code).
  documents:
    assureur:
      nom: "Assur'Easy SA (assureur fictif)"
      adresse: "10 rue de la Recette, 75000 Paris"
      immatriculation: "Société anonyme au capital de 1 000 000 € - RCS Paris 000 000 000 (fictif)"
      controle: "Entreprise régie par le Code des assurances, contrôlée par l'ACPR (4 place de Budapest, 75009 Paris)"
    garanties:
      essentielle: ["Incendie et événements naturels", "Dégâts des eaux", "Responsabilité civile vie privée"]
      confort: ["Incendie et événements naturels", "Dégâts des eaux", "Responsabilité civile vie privée",
                "Vol et vandalisme", "Bris de glace"]
      serenite: ["Incendie et événements naturels", "Dégâts des eaux", "Responsabilité civile vie privée",
                 "Vol et vandalisme", "Bris de glace", "Rééquipement à neuf"]
      TIERS: ["Responsabilité civile", "Défense pénale et recours"]
      INTER: ["Responsabilité civile", "Défense pénale et recours", "Vol et incendie", "Bris de glace"]
      TR: ["Responsabilité civile", "Défense pénale et recours", "Vol et incendie", "Bris de glace",
           "Dommages tous accidents"]
    exclusions: "Les exclusions communes et propres à chaque garantie figurent dans les conditions générales."
    taille-max: 5MB
    reprise:
      active: ${DOCUMENTS_REPRISE_ACTIVE:true}
      intervalle: 5m
      delai-initial: 1m
      lot: 50
  # US-22, RG1 : taux de la taxe sur les conventions d'assurance (TSCA) imprimés sur les factures (exonérées de TVA).
  # PROVISOIRE, À VALIDER PAR LE PO : T-04 ne fournit aucun taux. Formule (garanties de base) : taux du produit ;
  # option : son taux propre, sinon celui du produit. Valeurs décimales (0.09 = 9 %).
  facturation:
    taux-par-produit:
      HABITATION: 0.09
      AUTO: 0.18
    taux-par-garantie:
      "[protection-juridique]": 0.134
      "[PROTECTION_JURIDIQUE]": 0.134
      "[assistance-depannage]": 0.09
      "[ASSISTANCE_0KM]": 0.09
      "[ASSISTANCE_PANNE]": 0.09

moteur-tarifaire:
  url: ${MOTEUR_TARIFAIRE_URL:http://localhost:8081}
