spring:
  cloud:
    openfeign:
      client:
        config:
          moteurtarifaire:
            connect-timeout: 1000
            read-timeout: 2000

  application:
    name: assurance-iard-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assurance_iard}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          # true : le login (SMTP_USER) est envoyé au serveur. Sans cela JavaMail ne
          # s'authentifie pas, même avec username/password renseignés (Mailpit : le
          # login sert de tag au mail). false par défaut : docker-compose local sans login.
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_TLS:false}
            required: ${SMTP_TLS:false}

  # US-13 : le service contrôle les 5 Mo avec un message précis ;
  # ces limites plus larges bloquent seulement les envois démesurés.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 13MB

# Une valeur refusée (téléphone, nom...) ne doit jamais finir dans les logs
logging:
  level:
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR

server:
  port: 8080
  forward-headers-strategy: framework

assurance:
  connexion:
    # Bouchons : code 123456 accepté et lien de réinitialisation écrit dans les logs.
    # Désactivés par défaut (voir helm.yaml, docker-compose.yaml et pom.xml).
    code-bouchon-actif: ${CODE_BOUCHON_ACTIF:false}
    url-frontend: ${FRONTEND_URL:http://localhost:4200}
  justificatifs:
    # Dossier local exclu de Git ; en ligne, dossier temporaire (voir helm.yaml).
    dossier: ${JUSTIFICATIFS_DOSSIER:justificatifs}
  mail:
    from: ${MAIL_FROM:noreply@assureasy.fr}

moteur-tarifaire:
  url: ${MOTEUR_TARIFAIRE_URL:http://localhost:8081}
