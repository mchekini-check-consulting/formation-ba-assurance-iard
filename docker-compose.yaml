services:
  postgres:
    image: postgres:16
    container_name: assurance-iard-postgres
    environment:
      POSTGRES_DB: assurance_iard
      POSTGRES_USER: ${POSTGRES_USER:?Créez le fichier .env avec POSTGRES_USER et POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Créez le fichier .env avec POSTGRES_USER et POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d assurance_iard"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: assurance-iard-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    container_name: assurance-iard-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/assurance_iard
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: "8080"
      LOG_LEVEL: debug
      CODE_BOUCHON_ACTIF: "true"
      JUSTIFICATIFS_DOSSIER: /tmp/justificatifs
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      MAIL_FROM: noreply@assureasy.fr
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
