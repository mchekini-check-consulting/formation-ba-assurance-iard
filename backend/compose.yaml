# Base locale pour npm run start:dev (même URL que la valeur par défaut de
# src/database/database.module.ts) :
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: assurance_iard
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
