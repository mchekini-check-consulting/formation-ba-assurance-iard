<header class="entete">
  <div class="entete__ligne">
    <a class="logo" routerLink="/" aria-label="Assur'Easy, accueil">
      <img class="logo__icone" src="favicon.png" alt="" width="36" height="36" />
      <span class="logo__nom serif">Assur'Easy</span>
    </a>
    <button type="button" class="btn btn--contour" (click)="seDeconnecter()">Se déconnecter</button>
  </div>
</header>

<main class="page">
  <section class="confirmation" aria-labelledby="espace-titre">
    <h1 id="espace-titre" class="serif">Mon espace</h1>
    <p>
      Vous êtes connecté avec <strong>{{ email() }}</strong>.
    </p>
    <a class="btn" routerLink="/espace-client/devis">Mes devis</a>
    @if (profil() === 'ADMINISTRATEUR') {
      <a class="btn btn--contour" routerLink="/admin/profils">Gérer les profils</a>
    }
  </section>
</main>
