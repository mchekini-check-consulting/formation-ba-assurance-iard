# Analyse SonarQube du composant (projet <dépôt>-<composant>), lancée par la CI
# après make test-unit (formation-ba-gitops/ci-template/sonarqube).
sonar.sources=src
sonar.tests=src
sonar.exclusions=**/*.spec.ts
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/assurance-iard-web/lcov.info
# Démarrage / câblage, sans logique à tester : hors calcul de couverture
sonar.coverage.exclusions=src/main.ts,**/*.config.ts,**/*.routes.ts
