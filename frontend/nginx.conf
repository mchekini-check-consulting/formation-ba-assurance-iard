# Remplace la config par défaut de l'image (même chemin).
# nginx tourne en non-root : il n'écoute que sur un port > 1024.
server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/app;
    index       index.html;

    # Application monopage : une route inconnue renvoie index.html,
    # le routeur côté navigateur affiche la bonne page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html jamais en cache : un nouveau déploiement est vu tout de suite
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
