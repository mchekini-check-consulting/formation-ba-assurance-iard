# Microservices de ce dépôt, déployés par formation-ba-gitops sur chaque environnement.
# Valeurs littérales uniquement. replicas, tag et envList[].value acceptent
# une valeur unique ou une map par environnement : { dev: ..., qualif: ..., prod: ... }
# URL : http://<env>-formation-ba-assurance-iard.check-consulting.net
applications:
  - name: backend
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-assurance-iard/backend
    tag: { dev: "", qualif: "", prod: "" }   # dev : écrit par la CI ; qualif/prod : promotion manuelle (PR)
    containerPort: 3000
    replicas: { dev: 1, qualif: 2, prod: 3 }
    service:
      port: 80
    ingress:
      enabled: true
      path: /api
      stripPrefix: true          # le pod reçoit /hello pour /api/hello
    envList:
      - key: LOG_LEVEL
        value: { dev: debug, qualif: info, prod: warn }

  - name: frontend
    type: frontend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-assurance-iard/frontend
    tag: { dev: "", qualif: "", prod: "" }   # dev : écrit par la CI ; qualif/prod : promotion manuelle (PR)
    containerPort: 8080
    replicas: { dev: 1, qualif: 2, prod: 3 }
    service:
      port: 80
    ingress:
      enabled: true
      path: /
