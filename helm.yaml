# Microservices de ce dépôt, déployés par formation-ba-gitops sur chaque environnement.
# Valeurs littérales uniquement. replicas, tag et envList[].value acceptent
# une valeur unique ou une map par environnement : { dev: ..., qualif: ..., preprod: ..., prod: ... }
# URL : frontend/gateway https://<application>.formation-ba-assurance-iard.<env>.check-consulting.net
#       backend : jamais d'URL directe (Service ClusterIP seulement), exposé par
#       le pod "gateway" ci-dessous (type: gateway) : .../gateway/<backend>/...
applications:
  - name: backend
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-assurance-iard/backend
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: "5731900"
      qualif: "5731900"
      preprod: ""
      prod: ""
    containerPort: 3000
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    # Pas d'Ingress direct : Service ClusterIP seulement. Exposé par le pod
    # "gateway" ci-dessous :
    #   https://gateway.formation-ba-assurance-iard.<env>.check-consulting.net/backend/...  (préfixe retiré)
    # Appelable depuis le navigateur uniquement par les frontends de l'environnement (CORS).
    # Base PostgreSQL assurance_iard : créée et sauvegardée automatiquement.
    # Consigne : dans le code (backend/src/database/database.module.ts), donner à
    # TypeORM la variable injectée DATABASE_URL :
    #   url: process.env.DATABASE_URL
    # DATABASE_URL (postgresql://<user>:<password>@<hôte>:<port>/<base>) contient déjà
    # l'utilisateur et le mot de passe. Valeurs séparées, injectées aussi :
    #   PGUSER, PGPASSWORD, PGHOST, PGPORT, PGDATABASE
    database:
      name: assurance_iard
    envList:
      - key: LOG_LEVEL
        value: {dev: debug, qualif: info, preprod: info, prod: warn}
  - name: microservice1
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-assurance-iard/microservice1
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: be93234
      qualif: be93234
      preprod: ""
      prod: ""
    containerPort: 3000
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    # Pas d'Ingress direct : Service ClusterIP seulement. Exposé par le pod
    # "gateway" ci-dessous :
    #   https://gateway.formation-ba-assurance-iard.<env>.check-consulting.net/microservice1/...  (préfixe retiré)
    # Appelable depuis le navigateur uniquement par les frontends de l'environnement (CORS).
    # Base PostgreSQL microservice1 : créée et sauvegardée automatiquement.
    # Consigne : dans le code (microservice1/src/database/database.module.ts), donner à
    # TypeORM la variable injectée DATABASE_URL :
    #   url: process.env.DATABASE_URL
    # DATABASE_URL (postgresql://<user>:<password>@<hôte>:<port>/<base>) contient déjà
    # l'utilisateur et le mot de passe. Valeurs séparées, injectées aussi :
    #   PGUSER, PGPASSWORD, PGHOST, PGPORT, PGDATABASE
    database:
      name: microservice1
    envList:
      - key: LOG_LEVEL
        value: {dev: debug, qualif: info, preprod: info, prod: warn}
  - name: contrats
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-assurance-iard/contrats
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: ""
      qualif: ""
      preprod: ""
      prod: ""
    containerPort: 3000
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    # Pas d'Ingress direct : Service ClusterIP seulement. Exposé par le pod
    # "gateway" ci-dessous :
    #   https://gateway.formation-ba-assurance-iard.<env>.check-consulting.net/contrats/...  (préfixe retiré)
    # Appelable depuis le navigateur uniquement par les frontends de l'environnement (CORS).
    # Base PostgreSQL contrats : créée et sauvegardée automatiquement.
    # Consigne : dans le code (contrats/src/database/database.module.ts), donner à
    # TypeORM la variable injectée DATABASE_URL :
    #   url: process.env.DATABASE_URL
    # DATABASE_URL (postgresql://<user>:<password>@<hôte>:<port>/<base>) contient déjà
    # l'utilisateur et le mot de passe. Valeurs séparées, injectées aussi :
    #   PGUSER, PGPASSWORD, PGHOST, PGPORT, PGDATABASE
    database:
      name: contrats
    envList:
      - key: LOG_LEVEL
        value: {dev: debug, qualif: info, preprod: info, prod: warn}
  - name: gateway
    type: gateway
    # Pas d'image/tag : fourni par la plateforme (petit Traefik autonome),
    # rien à construire ni à promouvoir. Expose les backends ci-dessus
    # (type: backend) sous https://gateway.formation-ba-assurance-iard.<env>.check-consulting.net/<backend>/...
    # (préfixe retiré) ; CORS limité aux frontends de l'environnement.
    # Configuration personnalisée (routage, rate limiting, authentification
    # centralisée...) : voir gateway.yaml à la racine du dépôt. Si ce fichier
    # est absent, le routage vers les backends ci-dessus est généré
    # automatiquement (comportement par défaut).
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    ingress:
      enabled: true
  - name: frontend
    type: frontend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-assurance-iard/frontend
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: 20e4c57
      qualif: 4c22d60
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    ingress:
      enabled: true
      path: /
      stripPrefix: false
