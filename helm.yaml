# Microservices de ce dépôt, déployés par formation-ba-gitops sur chaque environnement.
# Valeurs littérales uniquement. replicas, tag et envList[].value acceptent
# une valeur unique ou une map par environnement : { dev: ..., qualif: ..., preprod: ..., prod: ... }
# URL : frontend/gateway https://<application>.formation-ba-assurance-iard.<env>.check-consulting.net
#       backend : jamais d'URL directe (Service ClusterIP seulement), exposé par
#       le pod "gateway" ci-dessous (type: gateway) : .../gateway/<backend>/...
applications:
  - name: assurance-iard-api
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-assurance-iard/assurance-iard-api
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: 470d017
      qualif: 44f1940
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    # Pas d'Ingress direct : Service ClusterIP seulement. Exposé par le pod
    # "gateway" ci-dessous :
    #   https://gateway.formation-ba-assurance-iard.<env>.check-consulting.net/assurance-iard-api/...  (préfixe retiré)
    # Appelable depuis le navigateur uniquement par les frontends de l'environnement (CORS).
    # Base PostgreSQL assurance_iard : créée et sauvegardée automatiquement.
    # Consigne : dans le code (assurance-iard-api/src/database/database.module.ts), donner à
    # TypeORM la variable injectée DATABASE_URL :
    #   url: process.env.DATABASE_URL
    # DATABASE_URL (postgresql://<user>:<password>@<hôte>:<port>/<base>) contient déjà
    # l'utilisateur et le mot de passe. Valeurs séparées, injectées aussi :
    #   PGUSER, PGPASSWORD, PGHOST, PGPORT, PGDATABASE
    database:
      name: assurance_iard
    envList:
      - key: LOG_LEVEL
        value: {dev: debug, qualif: info, preprod: info, prod: warn}
      # Bouchon US-07 : lien de réinitialisation du mot de passe écrit dans les logs (jamais en preprod ni en prod).
      # Le code de connexion US-06 est envoyé par e-mail (Mailpit) : pas de code de test (CODE_TEST_CONNEXION_ACTIF éteint).
      - key: CODE_BOUCHON_ACTIF
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # US-07 : adresse de l'écran, pour construire le lien de réinitialisation du mot de passe.
      - key: FRONTEND_URL
        value:
          dev: https://frontend.formation-ba-assurance-iard.dev.check-consulting.net
          qualif: https://frontend.formation-ba-assurance-iard.qualif.check-consulting.net
          preprod: https://frontend.formation-ba-assurance-iard.preprod.check-consulting.net
          prod: https://frontend.formation-ba-assurance-iard.prod.check-consulting.net
      # Appel du moteur tarifaire à l'intérieur du cluster, sans passer par le gateway.
      - key: MOTEUR_TARIFAIRE_URL
        value: http://moteurtarifaire:80
      # US-13 : dossier temporaire, vidé à chaque redémarrage. Faux documents uniquement.
      - key: JUSTIFICATIFS_DOSSIER
        value: /tmp/justificatifs
      # US-16 : envoi d'e-mail de signature via le Mailpit central de la plateforme
      # (dev/qualif : capture les e-mails, rien n'est envoyé vers l'extérieur), lus sur
      # https://mailpit.dev.check-consulting.net (SSO Keycloak), filtre tag:<env>-formation-ba-assurance-iard.
      # preprod/prod : SMTP réel (Brevo), à renseigner avant d'ouvrir ces environnements.
      - key: SMTP_HOST
        value:
          dev: mailpit.mailpit.svc.cluster.local
          qualif: mailpit.mailpit.svc.cluster.local
          preprod: ""
          prod: ""
      - key: SMTP_PORT
        value: "1025"
      - key: SMTP_TLS
        value: "false"
      # Login SMTP = tag du mail dans Mailpit (sépare dev et qualif des autres projets).
      # Mot de passe non vérifié par Mailpit (MP_SMTP_AUTH_ACCEPT_ANY) : pas un secret.
      - key: SMTP_AUTH
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      - key: SMTP_USER
        value:
          dev: dev-formation-ba-assurance-iard
          qualif: qualif-formation-ba-assurance-iard
          preprod: ""
          prod: ""
      - key: SMTP_PASSWORD
        value: {dev: mailpit, qualif: mailpit, preprod: "", prod: ""}
      - key: MAIL_FROM
        value: noreply@assureasy.fr
  - name: gateway
    type: gateway
    # Pas d'image/tag : fourni par la plateforme (petit Traefik autonome),
    # rien à construire ni à promouvoir. Expose les backends ci-dessus
    # (type: backend) sous https://gateway.formation-ba-assurance-iard.<env>.check-consulting.net/<backend>/...
    # (préfixe retiré) ; CORS limité aux frontends de l'environnement.
    # Configuration personnalisée (routage, rate limiting, authentification
    # centralisée...) : voir gateway.yaml à la racine du dépôt. Si ce fichier
    # est absent, le routage vers les backends ci-dessus est généré
    # automatiquement (comportement par défaut).
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    ingress:
      enabled: true
  - name: frontend
    type: frontend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-assurance-iard/frontend
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: bae10c2
      qualif: bae10c2
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    ingress:
      enabled: true
      path: /
      stripPrefix: false
  - name: health
    type: frontend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-assurance-iard/health
    # Écran minimaliste de santé du backend : connexion Keycloak (realm
    # check-projects-sso, client assureasy-frontend-client), puis appel de
    # /assurance-iard-api/actuator/health par le gateway avec le token (route protégée
    # par le middleware jwt de gateway.yaml).
    # https://health.formation-ba-assurance-iard.<env>.check-consulting.net
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: bae10c2
      qualif: bae10c2
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: 1
    service:
      port: 80
    ingress:
      enabled: true
      path: /
      stripPrefix: false
  - name: moteurtarifaire
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-assurance-iard/moteurtarifaire
    tag:
      dev: 3bc7451
      qualif: 3bc7451
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    database:
      name: moteurtarifaire
    envList:
      - key: LOG_LEVEL
        value: {dev: debug, qualif: info, preprod: info, prod: warn}
      - key: SERVER_PORT
        value: "8080"
