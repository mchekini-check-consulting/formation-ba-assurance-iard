spring:
  application:
    name: moteurtarifaire-api

  datasource:
    url: jdbc:postgresql://localhost:5432/moteurtarifaire
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    net.checkconsulting.moteurtarifaire.api: ${LOG_LEVEL:info}

server:
  port: 8081
  forward-headers-strategy: framework
