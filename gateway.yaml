# Configuration personnalisée du pod "gateway" (helm.yaml, type: gateway) :
# routage et CORS pour l'instant, au format natif du "file provider" de
# Traefik. Optionnel : si ce fichier n'existe pas, le routage vers les
# backends de helm.yaml est généré automatiquement (ce fichier sert surtout
# d'exemple pour l'instant, le routage par défaut suffit).
#
# Lu par l'Application ArgoCD du projet comme un fichier de values Helm
# supplémentaire (ignoré s'il est absent). gatewayConfig est une CHAÎNE
# (bloc `|`), passée à la fonction `tpl` de Helm avant utilisation : on peut
# donc y écrire {{ .project }}, {{ .env }}, {{ .domain }} pour que la même
# configuration s'adapte aux 4 environnements (dev/qualif/preprod/prod),
# plutôt que d'en écrire une copie par environnement.
gatewayConfig: |
  http:
    routers:
      backend:
        rule: "PathPrefix(`/backend`)"
        service: backend
        middlewares: [backend-strip, cors]
    middlewares:
      backend-strip:
        stripPrefix: {prefixes: ["/backend"]}
      cors:
        headers:
          accessControlAllowOriginList:
            - https://frontend.{{ .project }}.{{ .env }}.{{ .domain }}
          accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          accessControlAllowHeaders: [Content-Type, Authorization]
          accessControlMaxAge: 600
          addVaryHeader: true
    services:
      backend:
        loadBalancer: {servers: [{url: "http://backend:80"}]}
